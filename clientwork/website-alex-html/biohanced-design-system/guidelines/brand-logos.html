<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-text);background:var(--warm-white);padding:16px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:168px}
.cell{border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cell img{max-width:82%;max-height:70%;object-fit:contain}</style></head>
<body><div class="grid">
  <div class="cell" style="background:var(--ink)"><img src="../assets/logos/logo-horizontal-on-dark.png" alt="horizontal on dark"></div>
  <div class="cell" style="background:var(--warm-white);border:1px solid var(--line-light)"><img src="../assets/logos/logo-horizontal-on-light.png" alt="horizontal on light"></div>
  <div class="cell" style="background:var(--ink)"><img src="../assets/logos/logo-stacked-on-dark.png" alt="stacked on dark"></div>
  <div class="cell" style="background:var(--ink)"><img src="../assets/logos/wordmark-on-dark.png" alt="wordmark on dark"></div>
</div></body></html>
