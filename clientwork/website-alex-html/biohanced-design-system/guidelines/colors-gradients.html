<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-text);background:var(--warm-white);padding:18px;box-sizing:border-box}
.row{display:flex;gap:16px;height:124px}
.g{flex:1;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff}
.n{font-size:12px;font-weight:600}.h{font-size:10px;opacity:.85;margin-top:2px}</style></head>
<body><div class="row">
  <div class="g" style="background:var(--grad-mark)"><div class="n">Mark gradient</div><div class="h">--grad-mark · 150° blue→indigo→green</div></div>
  <div class="g" style="background:var(--grad-mark-soft)"><div class="n">Mark (soft)</div><div class="h">--grad-mark-soft · nav / icons</div></div>
  <div class="g" style="background:var(--grad-hero)"><div class="n">Hero field</div><div class="h">--grad-hero · dark 135°</div></div>
</div></body></html>
