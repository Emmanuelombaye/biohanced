<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4-based rhythm" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-text);background:var(--warm-white);padding:22px;box-sizing:border-box}
.row{display:flex;align-items:flex-end;gap:16px;height:90px}
.c{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:10px;color:var(--slate)}
.b{background:var(--volt-blue);width:22px;border-radius:3px}</style></head>
<body><div class="row">
  <div class="c"><div class="b" style="height:4px"></div>4</div>
  <div class="c"><div class="b" style="height:8px"></div>8</div>
  <div class="c"><div class="b" style="height:12px"></div>12</div>
  <div class="c"><div class="b" style="height:16px"></div>16</div>
  <div class="c"><div class="b" style="height:24px"></div>24</div>
  <div class="c"><div class="b" style="height:32px"></div>32</div>
  <div class="c"><div class="b" style="height:48px"></div>48</div>
  <div class="c"><div class="b" style="height:64px"></div>64</div>
  <div class="c"><div class="b" style="height:80px"></div>80</div>
</div></body></html>
