<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-text);padding:20px;box-sizing:border-box;background:var(--warm-white);display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

.nm{font-weight:600;font-size:15px;color:var(--text-body);line-height:1.2}
.ct{font-size:12px;color:var(--steel);margin-top:4px}</style></head>
<body>

  <div class="t"><div class="mk" style="background:linear-gradient(145deg,#14e0b0,#4fd07a)"><svg width="20" height="20" viewBox="0 0 100 100"><path d="M57 9 L29 55 L46 55 L43 91 L73 41 L55 41 Z" fill="#fff"/></svg></div><div><div class="nm">Longevity &amp; Cellular</div><div class="ct">4 products</div></div></div>
