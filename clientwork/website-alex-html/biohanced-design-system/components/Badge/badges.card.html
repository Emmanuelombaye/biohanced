<!-- @dsCard group="Components" viewport="700x150" name="Badge" subtitle="Purity, save pill, category dot, cart count" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-text);padding:24px;box-sizing:border-box;background:var(--warm-white);display:flex;align-items:center;gap:26px;flex-wrap:wrap;height:150px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--success-bg);border:1px solid var(--success-line);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--success-ink)}
.pd{width:6px;height:6px;border-radius:50%;background:var(--success)}
.cat{display:inline-flex;align-items:center;gap:7px}
.cd{width:7px;height:7px;border-radius:50%}
.cl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel)}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--volt-green);color:var(--ink);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}</style></head>
<body>
  <span style="font-size:12px;color:var(--success)">99.7% purity</span>
  <span class="pill"><span class="pd"></span>Save 12%</span>
  <span class="cat"><span class="cd" style="background:var(--cat-recovery)"></span><span class="cl">Healing &amp; Recovery</span></span>
  <span class="cat"><span class="cd" style="background:var(--cat-metabolic)"></span><span class="cl">Metabolic</span></span>
  <span class="count">3</span>
</body></html>
