<!-- @dsCard group="Colors" viewport="700x210" name="Colorways" subtitle="Voltage is primary; 5 campaign accents keep the Ink + Warm White base" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-text);background:var(--warm-white);padding:16px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cw{border-radius:12px;overflow:hidden;background:var(--ink)}
.chip{height:44px;display:flex;align-items:center;gap:10px;padding:0 14px}
.mk{width:26px;height:26px;border-radius:8px}
.nm{font-size:12px;font-weight:600;color:#fff}.bar{height:10px;display:flex}.bar>div{flex:1}</style></head>
<body><div class="grid">
  <div class="cw"><div class="chip"><div class="mk" style="background:linear-gradient(145deg,#4f7bff,#8f74f5 48%,#b6ee6c)"></div><div class="nm">Voltage · primary</div></div><div class="bar"><div style="background:#2e6bff"></div><div style="background:#7c5cff"></div><div style="background:#b6ff3a"></div></div></div>
  <div class="cw"><div class="chip"><div class="mk" style="background:linear-gradient(145deg,#2be3ff,#8a5cff 50%,#ff5ed1)"></div><div class="nm">Plasma</div></div><div class="bar"><div style="background:#2be3ff"></div><div style="background:#8a5cff"></div><div style="background:#ff5ed1"></div></div></div>
  <div class="cw"><div class="chip"><div class="mk" style="background:linear-gradient(145deg,#ffc24b,#ff6a3d 52%,#ff2e7e)"></div><div class="nm">Ember</div></div><div class="bar"><div style="background:#ffc24b"></div><div style="background:#ff6a3d"></div><div style="background:#ff2e7e"></div></div></div>
  <div class="cw"><div class="chip"><div class="mk" style="background:linear-gradient(145deg,#14e0b0,#4fd07a 50%,#c2f15a)"></div><div class="nm">Biotic</div></div><div class="bar"><div style="background:#14e0b0"></div><div style="background:#4fd07a"></div><div style="background:#c2f15a"></div></div></div>
  <div class="cw"><div class="chip"><div class="mk" style="background:linear-gradient(145deg,#5ac8fa,#a06bff 50%,#ff8fc7)"></div><div class="nm">Aurora</div></div><div class="bar"><div style="background:#5ac8fa"></div><div style="background:#a06bff"></div><div style="background:#ff8fc7"></div></div></div>
  <div class="cw"><div class="chip"><div class="mk" style="background:linear-gradient(145deg,#6c7280,#9aa0ab 50%,#e6e8ec)"></div><div class="nm">Graphite · neutral</div></div><div class="bar"><div style="background:#6c7280"></div><div style="background:#9aa0ab"></div><div style="background:#e6e8ec"></div></div></div>
</div></body></html>
