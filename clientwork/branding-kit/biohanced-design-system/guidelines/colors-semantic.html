<!-- @dsCard group="Colors" viewport="700x150" name="Semantic & category" subtitle="Purity green, save badges, catalog dots" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-text);background:var(--warm-white);padding:18px;box-sizing:border-box}
.wrap{display:flex;gap:28px;align-items:center;height:114px}
.col{display:flex;flex-direction:column;gap:8px}
.lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--success-bg);border:1px solid var(--success-line);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--success-ink)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.dots{display:flex;gap:14px}.cd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:9px;color:var(--slate)}
.d{width:22px;height:22px;border-radius:50%}</style></head>
<body><div class="wrap">
  <div class="col"><div class="lab">Feedback</div>
    <span class="pill"><span class="dot"></span>Save 12%</span>
    <span style="font-size:12px;color:var(--success)">99.7% purity</span>
  </div>
  <div class="col"><div class="lab">Category dots</div>
    <div class="dots">
      <div class="cd"><div class="d" style="background:var(--cat-recovery)"></div>Recovery</div>
      <div class="cd"><div class="d" style="background:var(--cat-gh)"></div>GH</div>
      <div class="cd"><div class="d" style="background:var(--cat-metabolic)"></div>Metabolic</div>
      <div class="cd"><div class="d" style="background:var(--cat-longevity)"></div>Longevity</div>
      <div class="cd"><div class="d" style="background:var(--cat-specialty)"></div>Specialty</div>
      <div class="cd"><div class="d" style="background:var(--cat-essentials)"></div>Essentials</div>
    </div>
  </div>
</div></body></html>
