<!-- @dsCard group="Spacing" viewport="700x160" name="Radii & elevation" subtitle="Soft low-contrast shadows, generous rounding" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-text);background:var(--warm-white);padding:22px;box-sizing:border-box}
.row{display:flex;gap:22px;align-items:center;height:116px}
.card{background:#fff;width:150px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--slate);border:1px solid var(--line-light)}
.n{font-weight:600;color:var(--ink-3)}</style></head>
<body><div class="row">
  <div class="card" style="border-radius:10px;box-shadow:none"><span class="n">10px</span>button / input</div>
  <div class="card" style="border-radius:14px;box-shadow:var(--shadow-tile)"><span class="n">14px</span>category tile</div>
  <div class="card" style="border-radius:16px;box-shadow:var(--shadow-hover)"><span class="n">16px</span>product card</div>
  <div class="card" style="border-radius:26px;box-shadow:var(--shadow-card)"><span class="n">26px</span>hero panel</div>
</div></body></html>
