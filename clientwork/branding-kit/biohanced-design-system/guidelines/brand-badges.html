<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-text);background:var(--warm-white);padding:18px;box-sizing:border-box}
.wrap{display:flex;align-items:center;gap:26px;height:134px}
.badge{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:10px;color:var(--slate)}
.badge img{height:74px;width:auto;object-fit:contain}
.strip{display:flex;flex-direction:column;gap:9px}
.ti{display:flex;align-items:center;gap:9px;color:var(--text-body);font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--volt-green)}</style></head>
<body><div class="wrap">
  <div class="badge"><img src="../assets/logos/badge-gmp.png" alt="GMP badge">GMP</div>
  <div class="badge"><img src="../assets/logos/badge-usa-real.png" alt="USA made badge">USA made</div>
  <div class="strip">
    <div class="ti"><span class="dot"></span>≥99% purity, every batch</div>
    <div class="ti"><span class="dot"></span>Third-party HPLC &amp; MS tested</div>
    <div class="ti"><span class="dot"></span>COA on every product</div>
    <div class="ti"><span class="dot"></span>Cold-chain shipping</div>
  </div>
</div></body></html>
