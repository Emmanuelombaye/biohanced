<!-- @dsCard group="Type" viewport="700x260" name="Type scale" subtitle="Hero → micro, both families" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-text);background:var(--warm-white);padding:20px;box-sizing:border-box;color:var(--ink-3)}
.r{display:flex;align-items:baseline;gap:14px;padding:5px 0;border-bottom:1px solid #ececea}
.d{font-family:var(--font-display);font-weight:900;letter-spacing:-.02em}
.t{color:var(--slate);font-size:11px;margin-left:auto}</style></head>
<body>
  <div class="r"><span class="d" style="font-size:34px">Display 34</span><span class="t">--fs-h1 · Archivo 900</span></div>
  <div class="r"><span class="d" style="font-size:24px">Heading 24</span><span class="t">--fs-h2</span></div>
  <div class="r"><span class="d" style="font-size:20px">Product name 20</span><span class="t">--fs-product</span></div>
  <div class="r"><span style="font-size:16px">Lead paragraph 16</span><span class="t">--fs-lead · Space Grotesk</span></div>
  <div class="r"><span style="font-size:14px">UI / nav / button 14</span><span class="t">--fs-sm</span></div>
  <div class="r" style="border:none"><span style="font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--slate)">Eyebrow 11</span><span class="t">--fs-micro</span></div>
</body></html>
