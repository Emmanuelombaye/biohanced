<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-text);background:var(--ink);height:180px;display:flex;align-items:center;justify-content:center;gap:44px}
.slot{display:flex;flex-direction:column;align-items:center;gap:10px}
.cap{font-size:10px;color:var(--steel)}
.mk{border-radius:26px;background:var(--grad-mark);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-mark)}</style></head>
<body>
  <div class="slot"><div class="mk" style="width:120px;height:120px;border-radius:34px"><svg width="62" height="62" viewBox="0 0 100 100"><path d="M57 9 L29 55 L46 55 L43 91 L73 41 L55 41 Z" fill="#0a0b0e"/></svg></div><div class="cap">Primary · knockout bolt</div></div>
  <div class="slot"><div class="mk" style="width:64px;height:64px;border-radius:18px"><svg width="34" height="34" viewBox="0 0 100 100"><path d="M57 9 L29 55 L46 55 L43 91 L73 41 L55 41 Z" fill="#fff"/></svg></div><div class="cap">Small · white bolt</div></div>
  <div class="slot"><div class="mk" style="width:44px;height:44px;border-radius:12px;background:var(--grad-mark-soft)"><svg width="24" height="24" viewBox="0 0 100 100"><path d="M57 9 L29 55 L46 55 L43 91 L73 41 L55 41 Z" fill="#fff"/></svg></div><div class="cap">Nav · soft gradient</div></div>
</body></html>
