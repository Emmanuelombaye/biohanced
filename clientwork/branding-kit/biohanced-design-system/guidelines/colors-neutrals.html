<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — Ink to Warm White" subtitle="Near-black surface, warm paper background" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-text);background:var(--warm-white)}
.row{display:flex;height:150px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.n{font-size:12px;font-weight:600}.h{font-size:10px;margin-top:2px;opacity:.75}</style></head>
<body><div class="row">
  <div class="sw" style="background:var(--ink);color:#fff"><div class="n">Ink</div><div class="h">#0A0B0E</div></div>
  <div class="sw" style="background:var(--ink-2);color:#fff"><div class="n">Ink 2</div><div class="h">#14161A</div></div>
  <div class="sw" style="background:var(--slate);color:#fff"><div class="n">Slate</div><div class="h">#6C7280</div></div>
  <div class="sw" style="background:var(--steel);color:#1f2329"><div class="n">Steel</div><div class="h">#9AA0A8</div></div>
  <div class="sw" style="background:var(--mist);color:#1f2329"><div class="n">Mist</div><div class="h">#E6E8EC</div></div>
  <div class="sw" style="background:var(--warm-white);color:#16181d;box-shadow:inset 1px 0 0 #e2e0da"><div class="n">Warm White</div><div class="h">#F6F5F2</div></div>
</div></body></html>
