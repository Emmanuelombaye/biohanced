<!-- @dsCard group="Components" viewport="700x380" name="ProductCard" subtitle="Dark image panel · category, name, price, purity" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-text);padding:20px;box-sizing:border-box;background:var(--warm-white);display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border:1px solid var(--line-light);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-card)}
.img{height:160px;background:linear-gradient(150deg,#0b0d12,#16203a);display:flex;align-items:center;justify-content:center;overflow:hidden}
.img img{max-height:86%;max-width:70%;object-fit:contain}
.pad{padding:18px}
.cat{display:inline-flex;align-items:center;gap:7px}.cd{width:7px;height:7px;border-radius:50%}
.cl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel)}
.nm{font-family:var(--font-display);font-weight:900;font-size:20px;letter-spacing:-.01em;color:var(--text-body);margin-top:8px}
.sz{font-size:13px;color:var(--text-muted);margin-top:3px}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.pr{font-family:var(--font-display);font-weight:800;font-size:17px}
.pu{font-size:12px;color:var(--success)}</style></head>
<body>
  <div class="card"><div class="img"><img src="../../assets/products/bpc157.png" alt="BPC-157"></div><div class="pad"><span class="cat"><span class="cd" style="background:var(--cat-recovery)"></span><span class="cl">Healing &amp; Recovery</span></span><div class="nm">BPC-157</div><div class="sz">5mg · lyophilized</div><div class="foot"><span class="pr">From $59</span><span class="pu">99.7%</span></div></div></div>
  <div class="card"><div class="img"><img src="../../assets/products/retatrutide.png" alt="Retatrutide"></div><div class="pad"><span class="cat"><span class="cd" style="background:var(--cat-metabolic)"></span><span class="cl">Metabolic &amp; Weight</span></span><div class="nm">Retatrutide</div><div class="sz">15mg</div><div class="foot"><span class="pr">From $249</span><span class="pu">99.5%</span></div></div></div>
  <div class="card"><div class="img"><img src="../../assets/products/ghkcu.png" alt="GHK-Cu"></div><div class="pad"><span class="cat"><span class="cd" style="background:var(--cat-longevity)"></span><span class="cl">Longevity &amp; Cellular</span></span><div class="nm">GHK-Cu</div><div class="sz">50mg</div><div class="foot"><span class="pr">From $129</span><span class="pu">99.8%</span></div></div></div>
</body></html>
