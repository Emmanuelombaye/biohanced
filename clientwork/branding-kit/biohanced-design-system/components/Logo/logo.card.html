<!-- @dsCard group="Components" viewport="700x180" name="Logo" subtitle="Horizontal, stacked, mark — on ink & light" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-text);height:180px;display:flex}
.pane{flex:1;display:flex;align-items:center;justify-content:center;gap:30px}
.mk{background:var(--grad-mark);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wm{display:flex;flex-direction:column;line-height:.92}
.bh{font-family:var(--font-display);font-weight:900;letter-spacing:-.02em}
.lb{font-weight:600;letter-spacing:.5em;margin-top:6px;padding-left:3px}</style></head>
<body>
  <div class="pane" style="background:var(--ink)">
    <div style="display:flex;align-items:center;gap:14px">
      <div class="mk" style="width:52px;height:52px;border-radius:15px"><svg width="27" height="27" viewBox="0 0 100 100"><path d="M57 9 L29 55 L46 55 L43 91 L73 41 L55 41 Z" fill="#fff"/></svg></div>
      <div class="wm"><span class="bh" style="font-size:24px;color:#fff">BIOHANCED</span><span class="lb" style="font-size:10px;color:var(--volt-green)">LABS</span></div>
    </div>
    <div class="mk" style="width:64px;height:64px;border-radius:18px"><svg width="34" height="34" viewBox="0 0 100 100"><path d="M57 9 L29 55 L46 55 L43 91 L73 41 L55 41 Z" fill="#0a0b0e"/></svg></div>
  </div>
  <div class="pane" style="background:var(--warm-white)">
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <div class="mk" style="width:56px;height:56px;border-radius:16px"><svg width="29" height="29" viewBox="0 0 100 100"><path d="M57 9 L29 55 L46 55 L43 91 L73 41 L55 41 Z" fill="#fff"/></svg></div>
      <div class="wm" style="align-items:center"><span class="bh" style="font-size:20px;color:var(--ink-3)">BIOHANCED</span><span class="lb" style="font-size:9px;color:var(--slate);padding-left:8px">LABS</span></div>
    </div>
  </div>
</body></html>
