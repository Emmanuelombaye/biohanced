<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; padding:0; }
  #stage { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
</style>
</helmet>
<div id="stage"></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){
    const BOLT = '<svg viewBox="0 0 100 100"><path d="M57 9 L29 55 L46 55 L43 91 L73 41 L55 41 Z" fill="BFILL"/></svg>';
    const grad = 'linear-gradient(150deg,#2e6bff,#7c5cff 55%,#b6ff3a)';
    const bolt = (px,fill)=>BOLT.replace('width','width').replace('<svg','<svg width="'+px+'" height="'+px+'"').replace('BFILL',fill);
    const squircle = (sz,rad,bg,boltpx,boltfill,shadow)=>'<div style="width:'+sz+'px;height:'+sz+'px;border-radius:'+rad+'px;background:'+bg+';display:flex;align-items:center;justify-content:center;'+(shadow||'')+'">'+bolt(boltpx,boltfill)+'</div>';
    const wordmark = (size,color,labelColor)=>'<div style="display:flex;flex-direction:column;line-height:.9;"><div style="font-family:Archivo,sans-serif;font-weight:900;font-size:'+size+'px;letter-spacing:-.025em;color:'+color+';">BIOHANCED</div><div style="font-family:\'Space Grotesk\',sans-serif;font-weight:600;font-size:'+(size*0.33)+'px;letter-spacing:.5em;color:'+labelColor+';margin-top:'+(size*0.22)+'px;padding-left:3px;">LABS</div></div>';

    this.assets = [
      {name:'icon-gradient-on-dark', bg:'#0a0b0e', html:squircle(560,156,grad,300,'#0a0b0e','box-shadow:0 30px 90px rgba(46,107,255,.45)')},
      {name:'icon-gradient-on-light', bg:'#f6f5f2', html:squircle(560,156,grad,300,'#f6f5f2','box-shadow:0 30px 80px rgba(46,107,255,.30)')},
      {name:'icon-white-bluebolt', bg:'#2e6bff', html:squircle(560,156,'#ffffff',300,'#2e6bff','')},
      {name:'favicon', bg:'#0a0b0e', html:squircle(560,156,grad,300,'#fff','')},
      {name:'logo-horizontal-on-dark', bg:'#0a0b0e', html:'<div style="display:flex;align-items:center;gap:60px;">'+squircle(220,62,grad,118,'#0a0b0e','')+wordmark(78,'#fff','#b6ff3a')+'</div>'},
      {name:'logo-horizontal-on-light', bg:'#f6f5f2', html:'<div style="display:flex;align-items:center;gap:60px;">'+squircle(220,62,grad,118,'#fff','')+wordmark(78,'#14161a','#54575f')+'</div>'},
      {name:'logo-stacked-on-dark', bg:'#0a0b0e', html:'<div style="display:flex;flex-direction:column;align-items:center;gap:46px;">'+squircle(240,68,grad,128,'#0a0b0e','')+'<div style="display:flex;flex-direction:column;align-items:center;line-height:1;"><div style="font-family:Archivo,sans-serif;font-weight:900;font-size:62px;letter-spacing:-.02em;color:#fff;">BIOHANCED</div><div style="font-family:\'Space Grotesk\',sans-serif;font-weight:600;font-size:22px;letter-spacing:.48em;color:#b6ff3a;margin-top:16px;padding-left:16px;">LABS</div></div></div>'},
      {name:'wordmark-on-dark', bg:'#0a0b0e', html:wordmark(110,'#fff','#b6ff3a')},
      {name:'logo-mono-black', bg:'#ffffff', html:'<div style="display:flex;align-items:center;gap:50px;">'+squircle(200,56,'#14161a',108,'#fff','')+wordmark(72,'#14161a','#54575f')+'</div>'},
      {name:'logo-reversed-on-dark', bg:'#14161a', html:'<div style="display:flex;align-items:center;gap:50px;">'+squircle(200,56,'#fff',108,'#14161a','')+wordmark(72,'#fff','#b6ff3a')+'</div>'},
      {name:'avatar', bg:'#eceae5', html:'<div style="width:760px;height:760px;border-radius:50%;background:#0a0b0e;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 90px rgba(0,0,0,.28);">'+squircle(420,118,grad,224,'#0a0b0e','')+'</div>'},
      {name:'stamp-on-green', bg:'#b6ff3a', html:'<div style="display:flex;flex-direction:column;align-items:center;gap:44px;">'+squircle(360,100,'#0a0b0e',192,'#b6ff3a','')+'<div style="font-family:Archivo,sans-serif;font-weight:900;font-size:54px;letter-spacing:-.01em;color:#0a0b0e;">BIOHANCED</div></div>'}
    ];
    window.__assets = this.assets;
    window.showAsset = (i)=>{ const a=this.assets[i]; const s=document.getElementById('stage'); s.style.background=a.bg; s.innerHTML=a.html; document.title=a.name; };
    window.showAsset(0);
  }
  renderVals(){ return {}; }
}
</script>
</body>
</html>
